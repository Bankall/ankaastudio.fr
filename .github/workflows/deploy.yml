name: Deploy the site

# The CloudFormation stack is deliberately not deployed from CI. It creates IAM
# roles, buckets and a CloudFront distribution, so it needs near-admin rights,
# while the credentials here belong to a user scoped to the site bucket and one
# invalidation path. Infrastructure changes go out from a workstation instead:
#   cd infra && ./deploy.sh

# A region is not a credential, so it lives here rather than in a secret that has
# to be kept in sync by hand. Mirrors AWS_REGION in infra/.env.deploy.example.
# The AWS CLI reads this variable directly, so the raw `aws` calls inherit it too.
env:
    AWS_REGION: eu-west-1

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    site:
        name: Build and publish the site
        runs-on: ubuntu-latest

        # A step `if:` cannot read the `secrets` context, only `env`. Hoisting the
        # one secret a condition depends on makes the guard below legal.
        env:
            CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Upload static assets
              run: |
                  aws s3 sync dist s3://${{ secrets.S3_BUCKET_NAME }} \
                    --delete \
                    --exclude "*.html" \
                    --exclude "robots.txt" \
                    --exclude "sitemap.xml" \
                    --cache-control "public,max-age=31536000,immutable"

            - name: Upload entry files
              run: |
                  aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
                    --cache-control "public,max-age=0,must-revalidate" \
                    --content-type "text/html"
                  aws s3 cp dist/404.html s3://${{ secrets.S3_BUCKET_NAME }}/404.html \
                    --cache-control "public,max-age=0,must-revalidate" \
                    --content-type "text/html"
                  aws s3 cp dist/robots.txt s3://${{ secrets.S3_BUCKET_NAME }}/robots.txt \
                    --cache-control "public,max-age=86400" \
                    --content-type "text/plain"
                  aws s3 cp dist/sitemap.xml s3://${{ secrets.S3_BUCKET_NAME }}/sitemap.xml \
                    --cache-control "public,max-age=86400" \
                    --content-type "application/xml"

            # Scoped to the entry documents. A wildcard invalidation would also evict
            # every cached photo — a needless bill and a slow gallery afterwards.
            # Hashed asset filenames never need invalidating.
            #
            # /gallery/* counts as an entry document: the API serves those pages by
            # injecting a gallery's link-preview tags into the index.html just
            # uploaded, so they carry the asset names that changed with it.
            - name: Invalidate CloudFront entry documents
              if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
                    --paths "/index.html" "/404.html" "/robots.txt" "/sitemap.xml" "/gallery/*"
