AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Ankaa Studio — static site + private client-gallery system. One CloudFront\
  \ distribution fronts three origins: the static site bucket, the gallery API (Lambda\
  \ Function URL) and the private media bucket. Media is protected by CloudFront signed\
  \ cookies (previews) and signed URLs (full-resolution downloads and ZIP archives).\n"
Parameters:
  DomainName:
    Type: String
    Default: ankaastudio.fr
    Description: Public apex domain. Only attached to the distribution once 
      CertificateArn is supplied.
  SiteBucketName:
    Type: String
    Default: ankaa-site
    Description: Bucket holding the built Vite site. Private, reachable only 
      through CloudFront (OAC).
  MediaBucketName:
    Type: String
    Default: ankaa-media
    Description: Bucket holding gallery originals, derivatives, ZIPs and the 
      JSON database. Never public.
  CertificateArn:
    Type: String
    Default: ''
    Description: "ACM certificate ARN for DomainName. MUST be issued in us-east-1.\
      \ Leave empty for the first deploy: the stack then comes up on its *.cloudfront.net\
      \ domain so everything can be tested before DNS moves.\n"
  KeyGroupId:
    Type: String
    Description: "CloudFront key group id for signed cookies/URLs, created by infra/bootstrap.sh\
      \ (CloudFormation cannot carry a PEM parameter cleanly).\n"
  CloudFrontKeyPairId:
    Type: String
    Description: CloudFront public key id belonging to KeyGroupId. Emitted by 
      infra/bootstrap.sh.
  SenderEmail:
    Type: String
    Default: contact@ankaastudio.fr
    Description: SES-verified sender used for "your gallery is ready" emails.
  SsmPrefix:
    Type: String
    Default: /ankaa/gallery
    Description: SSM Parameter Store prefix holding the secrets written by 
      infra/bootstrap.sh.
  ProcessorReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: "Concurrency cap on the image processor, or 0 to leave it unreserved.\
      \ Lambda refuses any reservation that leaves the account below 10 unreserved\
      \ executions, and a new AWS account's *total* quota is 10 — so this must stay\
      \ 0 until the \"Concurrent executions\" quota is raised.\n"
Conditions:
  HasCustomDomain:
    Fn::Not:
    - Fn::Equals:
      - Ref: CertificateArn
      - ''
  HasProcessorReservation:
    Fn::Not:
    - Fn::Equals:
      - Ref: ProcessorReservedConcurrency
      - 0
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
    - arm64
    MemorySize: 512
    Timeout: 15
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Ref: SiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Ref: MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: abort-incomplete-multipart
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 7
        - Id: originals-to-glacier-ir
          Status: Enabled
          Prefix: originals/
          Transitions:
          - StorageClass: GLACIER_IR
            TransitionInDays: 60
        - Id: expire-zip-cache
          Status: Enabled
          Prefix: media/g/
          TagFilters:
          - Key: ankaa-kind
            Value: zip
          ExpirationInDays: 30
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action:
          - s3:GetObject
          - s3:ListBucket
          Resource:
          - Fn::Sub: arn:aws:s3:::${SiteBucketName}
          - Fn::Sub: arn:aws:s3:::${SiteBucketName}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: 
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${MediaBucketName}/media/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: 
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  GalleryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ankaa-gallery-api
      CodeUri: 
        s3://ankaa-deploy-artifacts-471112957662/ankaa-gallery/c60c147fdc8b83ae2b812fc49b6dbf78
      Handler: index.handler
      Description: Gallery API — admin CRUD, client auth, presigns, CloudFront 
        signing.
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          MEDIA_BUCKET:
            Ref: MediaBucketName
          SSM_PREFIX:
            Ref: SsmPrefix
          CF_KEY_PAIR_ID:
            Ref: CloudFrontKeyPairId
          ZIPPER_FUNCTION:
            Ref: GalleryZipperFunction
          PROCESSOR_FUNCTION:
            Ref: GalleryProcessorFunction
          SENDER_EMAIL:
            Ref: SenderEmail
          PUBLIC_ORIGIN:
            Fn::If:
            - HasCustomDomain
            - Fn::Sub: https://${DomainName}
            - ''
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: MediaBucketName
      - Statement:
        - Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          - ssm:GetParametersByPath
          Resource:
            Fn::Sub: 
              arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*
        - Effect: Allow
          Action: kms:Decrypt
          Resource:
            Fn::Sub: arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
          - Fn::GetAtt:
            - GalleryZipperFunction
            - Arn
          - Fn::GetAtt:
            - GalleryProcessorFunction
            - Arn
        - Effect: Allow
          Action: ses:SendEmail
          Resource: '*'
  GalleryProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ankaa-gallery-processor
      CodeUri: 
        s3://ankaa-deploy-artifacts-471112957662/ankaa-gallery/14ed05fdffbd68a91c61350f8d4f7d0d
      Handler: index.handler
      Description: Derives watermarked previews, HD JPEG and LQIP from an 
        uploaded original.
      MemorySize: 2048
      Timeout: 60
      ReservedConcurrentExecutions:
        Fn::If:
        - HasProcessorReservation
        - Ref: ProcessorReservedConcurrency
        - Ref: AWS::NoValue
      Environment:
        Variables:
          MEDIA_BUCKET:
            Ref: MediaBucketName
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: MediaBucketName
  ZipperDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ankaa-gallery-zipper-dlq
      MessageRetentionPeriod: 1209600
  GalleryZipperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ankaa-gallery-zipper
      CodeUri: 
        s3://ankaa-deploy-artifacts-471112957662/ankaa-gallery/f8888dd0bd1df3f28fb6a15470a52c3b
      Handler: index.handler
      Description: Streams a store-mode ZIP of a gallery selection into S3 via 
        multipart upload.
      MemorySize: 1536
      Timeout: 900
      DeadLetterQueue:
        Type: SQS
        TargetArn:
          Fn::GetAtt:
          - ZipperDlq
          - Arn
      Environment:
        Variables:
          MEDIA_BUCKET:
            Ref: MediaBucketName
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: MediaBucketName
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - ZipperDlq
            - QueueName
  ApiUrlCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
        - GalleryApiFunction
        - Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn:
        Fn::Sub: 
          arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  MediaOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-media-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ApiOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-api-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4
  EdgeRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-edge-router
      AutoPublish: true
      FunctionConfig:
        Comment: Preserves the viewer host for /api/* and rewrites SPA routes to
          /index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: "function handler(event) {\n\tvar request = event.request;\n\t\
        var uri = request.uri;\n\n\t// The API needs to know which public origin it\
        \ is answering on so it\n\t// can scope cookies correctly. AllViewerExceptHostHeader\
        \ forwards any\n\t// header we add here, so smuggle the real host through.\n\
        \tif (uri.startsWith('/api/')) {\n\t\tif (request.headers.host) {\n\t\t\t\
        request.headers['x-ankaa-host'] = { value: request.headers.host.value };\n\
        \t\t}\n\t\treturn request;\n\t}\n\n\t// Static site: fold client-side routes\
        \ onto the SPA entry point.\n\tif (uri.endsWith('/')) {\n\t\trequest.uri =\
        \ uri + 'index.html';\n\t\treturn request;\n\t}\n\n\tvar segments = uri.split('/');\n\
        \tif (segments[segments.length - 1].indexOf('.') === -1) {\n\t\trequest.uri\
        \ = '/index.html';\n\t}\n\n\treturn request;\n}\n"
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${AWS::StackName} — site, gallery API and protected media
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases:
          Fn::If:
          - HasCustomDomain
          - - Ref: DomainName
            - Fn::Sub: www.${DomainName}
          - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
          - HasCustomDomain
          - AcmCertificateArn:
              Ref: CertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        Origins:
        - Id: site
          DomainName:
            Fn::Sub: ${SiteBucketName}.s3.${AWS::Region}.amazonaws.com
          OriginAccessControlId:
            Fn::GetAtt:
            - SiteOac
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        - Id: media
          DomainName:
            Fn::Sub: ${MediaBucketName}.s3.${AWS::Region}.amazonaws.com
          OriginAccessControlId:
            Fn::GetAtt:
            - MediaOac
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        - Id: api
          DomainName:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Fn::GetAtt:
                - GalleryApiFunctionUrl
                - FunctionUrl
          OriginAccessControlId:
            Fn::GetAtt:
            - ApiOac
            - Id
          CustomOriginConfig:
            OriginProtocolPolicy: https-only
            OriginSSLProtocols:
            - TLSv1.2
            OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId:
            Ref: SiteHeadersPolicy
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - EdgeRouterFunction
              - FunctionMetadata.FunctionARN
        CacheBehaviors:
        - PathPattern: /api/*
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - POST
          - PATCH
          - DELETE
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - EdgeRouterFunction
              - FunctionMetadata.FunctionARN
        - PathPattern: /media/*
          TargetOriginId: media
          ViewerProtocolPolicy: https-only
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: false
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          TrustedKeyGroups:
          - Ref: KeyGroupId
  SiteHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-site-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
Outputs:
  DistributionId:
    Description: Feed this to the GitHub Actions CLOUDFRONT_DISTRIBUTION_ID 
      secret.
    Value:
      Ref: Distribution
  DistributionDomain:
    Description: Test here before pointing DNS at it; also the CNAME target for 
      OVH.
    Value:
      Fn::GetAtt:
      - Distribution
      - DomainName
  SiteBucket:
    Description: Feed this to the GitHub Actions S3_BUCKET_NAME secret.
    Value:
      Ref: SiteBucket
  MediaBucket:
    Value:
      Ref: MediaBucket
  ApiFunctionUrl:
    Description: Direct origin URL. IAM-authenticated — not callable without 
      CloudFront.
    Value:
      Fn::GetAtt:
      - GalleryApiFunctionUrl
      - FunctionUrl
