AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Ankaa Studio — static site + private client-gallery system.
  One CloudFront distribution fronts three origins: the static site bucket,
  the gallery API (Lambda Function URL) and the private media bucket.
  Media is protected by CloudFront signed cookies (previews) and signed URLs
  (full-resolution downloads and ZIP archives).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
    DomainName:
        Type: String
        Default: ankaastudio.fr
        Description: Public apex domain. Only attached to the distribution once CertificateArn is supplied.

    SiteBucketName:
        Type: String
        Default: ankaa-site
        Description: Bucket holding the built Vite site. Private, reachable only through CloudFront (OAC).

    MediaBucketName:
        Type: String
        Default: ankaa-media
        Description: Bucket holding gallery originals, derivatives, ZIPs and the JSON database. Never public.

    CertificateArn:
        Type: String
        Default: ""
        Description: >
            ACM certificate ARN for DomainName. MUST be issued in us-east-1.
            Leave empty for the first deploy: the stack then comes up on its
            *.cloudfront.net domain so everything can be tested before DNS moves.

    KeyGroupId:
        Type: String
        Description: >
            CloudFront key group id for signed cookies/URLs, created by
            infra/bootstrap.sh (CloudFormation cannot carry a PEM parameter cleanly).

    CloudFrontKeyPairId:
        Type: String
        Description: CloudFront public key id belonging to KeyGroupId. Emitted by infra/bootstrap.sh.

    SenderEmail:
        Type: String
        Default: contact@ankaastudio.fr
        Description: SES-verified sender used for "your gallery is ready" emails.

    SsmPrefix:
        Type: String
        Default: /ankaa/gallery
        Description: SSM Parameter Store prefix holding the secrets written by infra/bootstrap.sh.

    DevUploadOrigin:
        Type: String
        Default: http://localhost:5173
        Description: >
            Extra origin allowed to POST presigned upload forms to the media
            bucket, for `npm run dev`. Vite proxies /api and /media, so the
            uploader's direct-to-S3 POST is the only dev call that leaves
            localhost — without this it fails the CORS preflight. Set empty to
            allow production origins only.

    ProcessorReservedConcurrency:
        Type: Number
        Default: 0
        MinValue: 0
        Description: >
            Concurrency cap on the image processor, or 0 to leave it unreserved.
            Lambda refuses any reservation that leaves the account below 10
            unreserved executions, and a new AWS account's *total* quota is 10 —
            so this must stay 0 until the "Concurrent executions" quota is raised.

Conditions:
    HasCustomDomain: !Not [!Equals [!Ref CertificateArn, ""]]
    HasDevUploadOrigin: !Not [!Equals [!Ref DevUploadOrigin, ""]]
    HasProcessorReservation: !Not [!Equals [!Ref ProcessorReservedConcurrency, 0]]

Globals:
    Function:
        Runtime: nodejs22.x
        Architectures: [arm64]
        MemorySize: 512
        Timeout: 15
        LoggingConfig:
            LogFormat: JSON
            ApplicationLogLevel: INFO
            SystemLogLevel: WARN

Resources:
    # -----------------------------------------------------------------------
    # Buckets
    # -----------------------------------------------------------------------
    SiteBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketName: !Ref SiteBucketName
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256

    MediaBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketName: !Ref MediaBucketName
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                    - ServerSideEncryptionByDefault:
                          SSEAlgorithm: AES256
            # The only cross-origin call in the whole system: the uploader POSTs a
            # presigned form straight to S3, bypassing CloudFront, so this is the one
            # place that needs CORS. Previews are same-origin through the distribution,
            # and the one other request that reaches the bucket directly — the presigned
            # GET behind a high-definition download — is a top-level navigation, which
            # CORS has nothing to say about.
            #
            # It needs a preflight at all only because the uploader listens for
            # upload progress: any listener on xhr.upload sets the upload listener
            # flag, which forces an OPTIONS even for an otherwise-simple
            # multipart/form-data POST.
            CorsConfiguration:
                CorsRules:
                    - Id: browser-presigned-upload
                      AllowedMethods: [POST]
                      AllowedOrigins:
                          - !Sub "https://${DomainName}"
                          - !Sub "https://www.${DomainName}"
                          # The distribution's own domain, where the admin stays
                          # reachable if DNS is mid-cutover or broken. It cannot be
                          # referenced as !GetAtt: the distribution already depends on
                          # this bucket, so that would be a circular dependency.
                          - "https://*.cloudfront.net"
                          # The Vite dev server. Listing it costs nothing: the form
                          # still has to be signed by the API, which needs an admin
                          # session, and CORS only decides who may read the answer —
                          # so this widens no access, it only lets the browser show
                          # the uploader the result instead of a preflight error.
                          - !If [HasDevUploadOrigin, !Ref DevUploadOrigin, !Ref "AWS::NoValue"]
                      # The POST carries no header worth naming — FormData's
                      # Content-Type is CORS-safelisted — but a header the rule does
                      # not cover fails the preflight with no useful diagnostic.
                      AllowedHeaders: ["*"]
                      # One preflight covers a whole batch: every file posts to the
                      # same bucket-root URL with the same method.
                      MaxAge: 3600
            # Uploads land as multipart from the browser; never leave orphans behind.
            LifecycleConfiguration:
                Rules:
                    - Id: abort-incomplete-multipart
                      Status: Enabled
                      AbortIncompleteMultipartUpload:
                          DaysAfterInitiation: 7
                    # Originals are only re-read when a gallery is re-processed.
                    # Glacier Instant Retrieval keeps that millisecond-fast at ~1/3 the price.
                    - Id: originals-to-glacier-ir
                      Status: Enabled
                      Prefix: originals/
                      Transitions:
                          - StorageClass: GLACIER_IR
                            TransitionInDays: 60
                    # Archiving a gallery deletes every derivative and tags what is
                    # left, which is how the originals get here. Deep Archive is ~4×
                    # cheaper again than Glacier IR and needs an explicit 48-hour
                    # restore, which is the trade the archived status exists to make.
                    #
                    # A tag, not a prefix: the gallery id sits in the middle of
                    # originals/<gid>/<pid>.<ext> and lifecycle prefixes cannot
                    # wildcard. The API tags on archive and untags on the way out —
                    # untagging alone brings nothing back, since transitions only ever
                    # go one way.
                    #
                    # 1 day, not 0: transitions are keyed on object age, not on when
                    # the tag was applied, so for anything older than a day this means
                    # "at the next daily lifecycle pass".
                    - Id: archived-originals-to-deep-archive
                      Status: Enabled
                      Prefix: originals/
                      TagFilters:
                          - Key: ankaa-state
                            Value: archived
                      Transitions:
                          - StorageClass: DEEP_ARCHIVE
                            TransitionInDays: 1
                    # ZIP job documents are progress trackers a client polls for a
                    # few minutes. Deleting a gallery does not remove them — on
                    # purpose: a job may still be running against it — so they are
                    # aged out here instead of accumulating forever.
                    - Id: expire-zip-jobs
                      Status: Enabled
                      Prefix: db/jobs/
                      ExpirationInDays: 7
                    # ZIPs are a rebuildable cache, keyed by content hash.
                    - Id: expire-zip-cache
                      Status: Enabled
                      Prefix: media/g/
                      TagFilters:
                          - Key: ankaa-kind
                            Value: zip
                      ExpirationInDays: 30

    # CloudFront may read the built site, and needs ListBucket so that a missing
    # key answers 404 rather than 403 (keeps real 403s meaningful for /media/*).
    SiteBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref SiteBucket
            PolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: [s3:GetObject, s3:ListBucket]
                      Resource:
                          - !Sub "arn:aws:s3:::${SiteBucketName}"
                          - !Sub "arn:aws:s3:::${SiteBucketName}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    # Scoped to media/* on purpose: db/ and originals/ live in the same bucket
    # but no CloudFront behaviour maps to them AND the policy refuses them.
    # Off the CDN by construction, not by convention. The one way an original
    # reaches a client is a 5-minute presigned GET signed by the API function's
    # own role — that is a client's high-definition download, uncompressed — and
    # nothing at all reaches db/.
    MediaBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref MediaBucket
            PolicyDocument:
                Version: "2012-10-17"
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "arn:aws:s3:::${MediaBucketName}/media/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                    # Public, unlike media/*: the Instagram mirror holds copies of
                    # already-public posts, so it has its own /instagram/* behaviour
                    # with no signed cookies. Separate statement, same OAC condition.
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "arn:aws:s3:::${MediaBucketName}/instagram/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                    # Also public: the marketing site's showreel. It lives here
                    # rather than in the site bucket so that a video the size of a
                    # whole site build stays out of git and out of every deploy —
                    # ./upload-video.sh replaces it on its own schedule.
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "arn:aws:s3:::${MediaBucketName}/video/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    # -----------------------------------------------------------------------
    # Lambdas
    # -----------------------------------------------------------------------
    GalleryApiFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: ankaa-gallery-api
            CodeUri: ../build/gallery-api
            Handler: index.handler
            Description: Gallery API — admin CRUD, client auth, presigns, CloudFront signing.
            Timeout: 15
            MemorySize: 512
            Environment:
                Variables:
                    MEDIA_BUCKET: !Ref MediaBucketName
                    # Read, not written: the gallery page is this bucket's index.html
                    # with per-gallery preview tags injected into its head.
                    SITE_BUCKET: !Ref SiteBucketName
                    SSM_PREFIX: !Ref SsmPrefix
                    CF_KEY_PAIR_ID: !Ref CloudFrontKeyPairId
                    ZIPPER_FUNCTION: !Ref GalleryZipperFunction
                    PROCESSOR_FUNCTION: !Ref GalleryProcessorFunction
                    SENDER_EMAIL: !Ref SenderEmail
                    # Fallback only: the edge function normally supplies x-ankaa-host.
                    PUBLIC_ORIGIN: !If [HasCustomDomain, !Sub "https://${DomainName}", ""]
            FunctionUrlConfig:
                AuthType: AWS_IAM
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref MediaBucketName
                - Statement:
                      # The one object of the site bucket this function ever touches:
                      # the SPA shell it rewrites for /gallery/*.
                      - Effect: Allow
                        Action: s3:GetObject
                        Resource: !Sub "arn:aws:s3:::${SiteBucketName}/index.html"
                      - Effect: Allow
                        Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
                        Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*"
                      - Effect: Allow
                        Action: kms:Decrypt
                        Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
                      - Effect: Allow
                        Action: lambda:InvokeFunction
                        Resource:
                            - !GetAtt GalleryZipperFunction.Arn
                            - !GetAtt GalleryProcessorFunction.Arn
                      - Effect: Allow
                        Action: ses:SendEmail
                        Resource: "*"
                      # Archiving a gallery. S3CrudPolicy covers neither tagging nor
                      # restores: the tag is what the deep-archive lifecycle rule
                      # matches on, and RestoreObject is the only way back out.
                      - Effect: Allow
                        Action: [s3:PutObjectTagging, s3:GetObjectTagging, s3:DeleteObjectTagging, s3:RestoreObject]
                        Resource: !Sub "arn:aws:s3:::${MediaBucketName}/*"

    GalleryProcessorFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: ankaa-gallery-processor
            CodeUri: ../build/gallery-processor
            Handler: index.handler
            Description: Derives watermarked previews, HD JPEG and LQIP from an uploaded original.
            # sharp is CPU-bound: more memory buys proportionally more vCPU, so a
            # bigger setting finishes faster at near-identical GB-s cost.
            MemorySize: 2048
            Timeout: 60
            # Bounds concurrent sharp workers during a large drag-and-drop batch, so
            # a 50-photo upload cannot crowd the API function out of the account's
            # concurrency pool and freeze the admin UI. Omitted entirely when 0:
            # until the account quota is raised there is no room to reserve from.
            ReservedConcurrentExecutions:
                !If [HasProcessorReservation, !Ref ProcessorReservedConcurrency, !Ref "AWS::NoValue"]
            Environment:
                Variables:
                    MEDIA_BUCKET: !Ref MediaBucketName
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref MediaBucketName

    ZipperDlq:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: ankaa-gallery-zipper-dlq
            MessageRetentionPeriod: 1209600

    GalleryZipperFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: ankaa-gallery-zipper
            CodeUri: ../build/gallery-zipper
            Handler: index.handler
            Description: Streams a store-mode ZIP of a gallery selection into S3 via multipart upload.
            # Network throughput scales with memory, and this function is entirely
            # I/O bound: more memory finishes proportionally sooner, so the GB-second
            # bill is roughly flat while the client waits half as long.
            MemorySize: 1536
            Timeout: 900
            DeadLetterQueue:
                Type: SQS
                TargetArn: !GetAtt ZipperDlq.Arn
            Environment:
                Variables:
                    MEDIA_BUCKET: !Ref MediaBucketName
            Policies:
                - S3CrudPolicy:
                      BucketName: !Ref MediaBucketName
                - SQSSendMessagePolicy:
                      QueueName: !GetAtt ZipperDlq.QueueName
                # S3CrudPolicy stops short of tagging, and the ankaa-kind=zip tag
                # is what drives the expire-zip-cache lifecycle rule — without
                # this grant the multipart upload fails outright and every
                # archive that did land would be stored forever.
                - Statement:
                      - Effect: Allow
                        Action: s3:PutObjectTagging
                        Resource: !Sub "arn:aws:s3:::${MediaBucketName}/media/g/*"

    # Pulls the studio's latest Instagram posts once a day, mirrors each image
    # into instagram/ and writes instagram/feed.json. The site reads that static
    # document, so the browser never touches Meta's API. See lambda/instagram-feed.
    InstagramFeedFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: ankaa-instagram-feed
            CodeUri: ../build/instagram-feed
            Handler: index.handler
            Description: Daily Instagram mirror — caches the latest posts into S3 for the home page.
            # A handful of image downloads plus a token refresh; well under a
            # minute. The memory is for sharp rather than for the downloads:
            # Instagram's originals run to 13 megapixels, and Lambda scales CPU
            # with memory, so the resize is quicker at 1 GB than it is cheap at
            # half of it.
            Timeout: 60
            MemorySize: 1024
            Environment:
                Variables:
                    MEDIA_BUCKET: !Ref MediaBucketName
                    SSM_PREFIX: /ankaa/instagram
            Events:
                Daily:
                    Type: Schedule
                    Properties:
                        Schedule: rate(1 day)
                        Description: Refresh the cached Instagram feed.
            Policies:
                # Scoped to instagram/*: the only prefix this function ever writes.
                # GetObject also covers the HeadObject existence check that skips
                # images already mirrored.
                - Statement:
                      - Effect: Allow
                        Action: [s3:PutObject, s3:GetObject]
                        Resource: !Sub "arn:aws:s3:::${MediaBucketName}/instagram/*"
                      # ListBucket, bucket-level and unconditioned, purely so a
                      # HeadObject on a missing key answers 404 instead of 403.
                      # Without it S3 hides existence with a 403, and a 403 on a
                      # (bodyless) HEAD is what the SDK surfaces as "UnknownError".
                      # It only grants key enumeration — object contents stay
                      # behind the instagram/*-scoped GetObject above.
                      - Effect: Allow
                        Action: s3:ListBucket
                        Resource: !Sub "arn:aws:s3:::${MediaBucketName}"
                      # Get to read the token + user id, Put to write back the
                      # 60-day token this function refreshes on every run.
                      - Effect: Allow
                        Action: [ssm:GetParameter, ssm:GetParameters, ssm:PutParameter]
                        Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ankaa/instagram/*"
                      - Effect: Allow
                        Action: [kms:Decrypt, kms:Encrypt]
                        Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"

    # Only CloudFront may invoke the Function URL — there is no public entry point.
    #
    # OAC needs BOTH grants. InvokeFunctionUrl alone looks sufficient and deploys
    # cleanly, but every request then comes back 403 "Forbidden. For troubleshooting
    # Function URL authorization issues": the signature validates and the identity
    # resolves, and the authorization check still fails.
    ApiUrlCloudFrontPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt GalleryApiFunction.Arn
            Action: lambda:InvokeFunctionUrl
            Principal: cloudfront.amazonaws.com
            FunctionUrlAuthType: AWS_IAM
            SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    ApiInvokeCloudFrontPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt GalleryApiFunction.Arn
            Action: lambda:InvokeFunction
            Principal: cloudfront.amazonaws.com
            SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    # -----------------------------------------------------------------------
    # CloudFront
    # -----------------------------------------------------------------------
    SiteOac:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: !Sub "${AWS::StackName}-site-oac"
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    MediaOac:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: !Sub "${AWS::StackName}-media-oac"
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    ApiOac:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: !Sub "${AWS::StackName}-api-oac"
                OriginAccessControlOriginType: lambda
                SigningBehavior: always
                SigningProtocol: sigv4

    # Viewer-request function doing two jobs:
    #   /api/*  -> preserve the viewer Host (the origin request policy strips it,
    #              because a Function URL insists on its own Host header)
    #   /*      -> SPA fallback for client-side routes
    # /media/* has its own behaviour and never runs this.
    EdgeRouterFunction:
        Type: AWS::CloudFront::Function
        Properties:
            Name: !Sub "${AWS::StackName}-edge-router"
            AutoPublish: true
            FunctionConfig:
                Comment: Preserves the viewer host for /api/* and /gallery/*, and rewrites SPA routes to /index.html.
                Runtime: cloudfront-js-2.0
            FunctionCode: |
                function handler(event) {
                	var request = event.request;
                	var uri = request.uri;

                	// The API needs to know which public origin it is answering on so it
                	// can scope cookies correctly. AllViewerExceptHostHeader forwards any
                	// header we add here, so smuggle the real host through.
                	//
                	// /gallery/* is served by the API too — it is the SPA shell with that
                	// gallery's link-preview tags written into it — so it needs the same
                	// header, and must not be folded onto /index.html the way every other
                	// client-side route below is.
                	if (uri.startsWith('/api/') || uri.startsWith('/gallery/')) {
                		if (request.headers.host) {
                			request.headers['x-ankaa-host'] = { value: request.headers.host.value };
                		}
                		return request;
                	}

                	// Static site: fold client-side routes onto the SPA entry point.
                	if (uri.endsWith('/')) {
                		request.uri = uri + 'index.html';
                		return request;
                	}

                	var segments = uri.split('/');
                	if (segments[segments.length - 1].indexOf('.') === -1) {
                		request.uri = '/index.html';
                	}

                	return request;
                }

    Distribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Enabled: true
                Comment: !Sub "${AWS::StackName} — site, gallery API and protected media"
                HttpVersion: http2and3
                IPV6Enabled: true
                PriceClass: PriceClass_100
                DefaultRootObject: index.html
                Aliases: !If
                    - HasCustomDomain
                    - [!Ref DomainName, !Sub "www.${DomainName}"]
                    - !Ref AWS::NoValue
                ViewerCertificate: !If
                    - HasCustomDomain
                    - AcmCertificateArn: !Ref CertificateArn
                      MinimumProtocolVersion: TLSv1.2_2021
                      SslSupportMethod: sni-only
                    - CloudFrontDefaultCertificate: true

                Origins:
                    - Id: site
                      DomainName: !Sub "${SiteBucketName}.s3.${AWS::Region}.amazonaws.com"
                      OriginAccessControlId: !GetAtt SiteOac.Id
                      S3OriginConfig:
                          OriginAccessIdentity: ""

                    - Id: media
                      DomainName: !Sub "${MediaBucketName}.s3.${AWS::Region}.amazonaws.com"
                      OriginAccessControlId: !GetAtt MediaOac.Id
                      S3OriginConfig:
                          OriginAccessIdentity: ""

                    - Id: api
                      DomainName: !Select [2, !Split ["/", !GetAtt GalleryApiFunctionUrl.FunctionUrl]]
                      OriginAccessControlId: !GetAtt ApiOac.Id
                      CustomOriginConfig:
                          OriginProtocolPolicy: https-only
                          OriginSSLProtocols: [TLSv1.2]
                          OriginReadTimeout: 30

                DefaultCacheBehavior:
                    TargetOriginId: site
                    ViewerProtocolPolicy: redirect-to-https
                    AllowedMethods: [GET, HEAD, OPTIONS]
                    Compress: true
                    # Managed-CachingOptimized
                    CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                    ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
                    FunctionAssociations:
                        - EventType: viewer-request
                          FunctionARN: !GetAtt EdgeRouterFunction.FunctionMetadata.FunctionARN

                CacheBehaviors:
                    - PathPattern: /api/*
                      TargetOriginId: api
                      ViewerProtocolPolicy: https-only
                      AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
                      Compress: true
                      # Managed-CachingDisabled — the cache key is irrelevant here…
                      CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
                      # …but every cookie, query string and header must still reach the
                      # Lambda. Host is the one exception a Function URL cannot accept.
                      OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
                      FunctionAssociations:
                          - EventType: viewer-request
                            FunctionARN: !GetAtt EdgeRouterFunction.FunctionMetadata.FunctionARN

                    # The gallery page, served by the API rather than from the bucket
                    # so that a shared link unfurls as the gallery it points at: the
                    # response is index.html with that gallery's Open Graph tags in
                    # its head. CachingOptimized keys the cache on the URI alone, so
                    # one render answers every visitor — and every crawler — for as
                    # long as the s-maxage the Lambda sets. A deploy changes the hashed
                    # asset names inside those documents, so infra/sync-site.sh
                    # invalidates /gallery/* along with the other entry points.
                    - PathPattern: /gallery/*
                      TargetOriginId: api
                      ViewerProtocolPolicy: redirect-to-https
                      AllowedMethods: [GET, HEAD, OPTIONS]
                      Compress: true
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                      # Only for x-ankaa-host, which is what lets the page print its own
                      # absolute URLs. Nothing it forwards is part of the cache key, and
                      # the route reads no cookies — a card that varied per visitor could
                      # not be cached under the URL alone.
                      OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
                      ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
                      FunctionAssociations:
                          - EventType: viewer-request
                            FunctionARN: !GetAtt EdgeRouterFunction.FunctionMetadata.FunctionARN

                    - PathPattern: /media/*
                      TargetOriginId: media
                      ViewerProtocolPolicy: https-only
                      AllowedMethods: [GET, HEAD, OPTIONS]
                      Compress: false
                      # CachingOptimized forwards no cookies, so the signature cookies
                      # stay out of the cache key and one edge copy serves every client.
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                      TrustedKeyGroups: [!Ref KeyGroupId]

                    # The Instagram mirror: public copies of public posts, so no
                    # TrustedKeyGroups. CachingOptimized honours the origin
                    # Cache-Control (1h on feed.json, immutable on the images), so
                    # a new post appears within a day of the schedule writing it.
                    - PathPattern: /instagram/*
                      TargetOriginId: media
                      ViewerProtocolPolicy: redirect-to-https
                      AllowedMethods: [GET, HEAD, OPTIONS]
                      Compress: true
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

                    # The home page showreel: public too, so no TrustedKeyGroups.
                    # Compression is off — an mp4 is already compressed, and the
                    # <video> element needs the byte ranges S3 serves untouched.
                    # CachingOptimized honours the day-long Cache-Control that
                    # upload-video.sh sets, and that script invalidates the prefix
                    # when it replaces the file.
                    - PathPattern: /video/*
                      TargetOriginId: media
                      ViewerProtocolPolicy: redirect-to-https
                      AllowedMethods: [GET, HEAD, OPTIONS]
                      Compress: false
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

    SiteHeadersPolicy:
        Type: AWS::CloudFront::ResponseHeadersPolicy
        Properties:
            ResponseHeadersPolicyConfig:
                Name: !Sub "${AWS::StackName}-site-headers"
                SecurityHeadersConfig:
                    ContentTypeOptions:
                        Override: true
                    FrameOptions:
                        FrameOption: SAMEORIGIN
                        Override: true
                    ReferrerPolicy:
                        ReferrerPolicy: strict-origin-when-cross-origin
                        Override: true
                    StrictTransportSecurity:
                        AccessControlMaxAgeSec: 31536000
                        IncludeSubdomains: true
                        Override: true

Outputs:
    DistributionId:
        Description: Feed this to the GitHub Actions CLOUDFRONT_DISTRIBUTION_ID secret.
        Value: !Ref Distribution

    DistributionDomain:
        Description: Test here before pointing DNS at it; also the CNAME target for OVH.
        Value: !GetAtt Distribution.DomainName

    SiteBucket:
        Description: Feed this to the GitHub Actions S3_BUCKET_NAME secret.
        Value: !Ref SiteBucket

    MediaBucket:
        Value: !Ref MediaBucket

    ApiFunctionUrl:
        Description: Direct origin URL. IAM-authenticated — not callable without CloudFront.
        Value: !GetAtt GalleryApiFunctionUrl.FunctionUrl
